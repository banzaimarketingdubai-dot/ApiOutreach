version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: revo_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-revo_masterdata}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: revo_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revo_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-revo_user}:${POSTGRES_PASSWORD:-revo_secret}@db:5432/${POSTGRES_DB:-revo_masterdata}
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
      - JWT_SECRET=${JWT_SECRET:-revo_super_secret_key_change_me_in_prod}
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: revo_celery_worker
    restart: always
    command: celery -A celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-revo_user}:${POSTGRES_PASSWORD:-revo_secret}@db:5432/${POSTGRES_DB:-revo_masterdata}
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
      - APIFY_API_TOKEN=${APIFY_API_TOKEN}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
